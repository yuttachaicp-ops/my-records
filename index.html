<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Records</title>
<meta name="theme-color" content="#1E3B5C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --navy:#1E3B5C; --cream:#FFFBF3; --yellow:#FDBA25; --muted:#7F8C99; --line:#EFE7DA; }
  html, body { margin:0; height:100%; background:var(--cream); color:var(--navy);
    font-family:system-ui, 'Noto Sans Thai', sans-serif; -webkit-tap-highlight-color:transparent; }
  #frame { position:fixed; inset:0; width:100%; height:100%; border:0; display:none; background:var(--cream); }
  .screen { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; box-sizing:border-box; text-align:center; gap:14px; }
  .screen img { width:120px; height:120px; border-radius:28px; box-shadow:0 8px 24px rgba(30,59,92,.18); }
  h1 { margin:6px 0 0; font-size:22px; }
  p { margin:0; color:var(--muted); font-size:14px; line-height:1.6; max-width:340px; }
  textarea { width:100%; max-width:360px; min-height:84px; border:2px solid var(--line); border-radius:14px; padding:12px;
    font:inherit; font-size:13px; color:var(--navy); background:#fff; box-sizing:border-box; resize:none; }
  textarea:focus { outline:none; border-color:var(--yellow); }
  button { border:0; border-radius:14px; padding:13px 22px; font:inherit; font-weight:700; font-size:15px; cursor:pointer; }
  .primary { background:var(--navy); color:#fff; width:100%; max-width:360px; }
  .ghost { background:transparent; color:var(--muted); font-weight:600; padding:8px; }
  .err { color:#E0474C; font-size:13px; min-height:18px; }
  .hidden { display:none !important; }
  #loading { background:var(--navy); color:#fff; }
  #loading p { color:rgba(255,255,255,.75); }
  .dots span { display:inline-block; width:8px; height:8px; margin:0 3px; border-radius:50%; background:var(--yellow);
    animation:b 1s infinite ease-in-out; }
  .dots span:nth-child(2) { animation-delay:.15s } .dots span:nth-child(3) { animation-delay:.3s }
  @keyframes b { 0%,80%,100% { transform:scale(.5); opacity:.5 } 40% { transform:scale(1); opacity:1 } }
  #fab { position:fixed; right:12px; bottom:calc(12px + env(safe-area-inset-bottom)); width:40px; height:40px; padding:0;
    border-radius:50%; background:rgba(30,59,92,.55); color:#fff; font-size:18px; display:none; z-index:5; }
  #sheet { position:fixed; inset:0; background:rgba(30,59,92,.4); display:flex; align-items:flex-end; z-index:10; }
  #sheet .box { background:#fff; width:100%; border-radius:22px 22px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:10px; box-sizing:border-box; }
  #sheet .box button { width:100%; }
  .sec { background:#FFF1DE; color:var(--navy); }
</style>
</head>
<body>

<div id="setup" class="screen hidden">
  <img src="icon-192.png" alt="">
  <h1>My Records</h1>
  <p>พิมพ์ "ลิงก์แอป" ในแชทบอท<br>คัดลอกลิงก์แดชบอร์ดที่ได้ มาวางตรงนี้</p>
  <textarea id="url" placeholder="https://script.google.com/macros/s/.../exec?view=dash&key=..."></textarea>
  <div class="err" id="err"></div>
  <button class="primary" id="save">เริ่มใช้งาน</button>
  <button class="ghost hidden" id="cancel">ยกเลิก</button>
</div>

<div id="loading" class="screen hidden">
  <img src="icon-192.png" alt="">
  <h1>My Records</h1>
  <div class="dots"><span></span><span></span><span></span></div>
  <p id="loadMsg">กำลังโหลดข้อมูล…</p>
</div>

<div id="offline" class="screen hidden">
  <img src="icon-192.png" alt="">
  <h1>ไม่มีอินเทอร์เน็ต</h1>
  <p>ต่อเน็ตแล้วกดลองใหม่ครับ 🐱</p>
  <button class="primary" id="retry">ลองใหม่</button>
</div>

<iframe id="frame" title="My Records" allow="clipboard-write"></iframe>
<button id="fab" aria-label="เมนู">⋯</button>

<div id="sheet" class="hidden">
  <div class="box">
    <button class="primary" id="reload">🔄 รีเฟรชข้อมูล</button>
    <button class="sec" id="change">🔗 เปลี่ยนลิงก์แดชบอร์ด</button>
    <button class="ghost" id="close">ปิด</button>
  </div>
</div>

<script>
(function () {
  var KEY = 'dashUrl';
  var $ = function (id) { return document.getElementById(id); };
  var store = {
    get: function () { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } },
    set: function (v) { try { localStorage.setItem(KEY, v); } catch (e) {} },
  };
  var current = '';

  function show(id) {
    ['setup', 'loading', 'offline'].forEach(function (s) { $(s).classList.toggle('hidden', s !== id); });
    $('frame').style.display = id ? 'none' : 'block';
    $('fab').style.display = id ? 'none' : 'block';
  }

  function clean(raw) {
    var s = String(raw || '').replace(/\s+/g, '');
    for (var i = 0; i < 3 && /%3A|%2F/i.test(s); i++) { try { s = decodeURIComponent(s); } catch (e) { break; } }
    var m = s.match(/https:\/\/script\.google(?:usercontent)?\.com\/[^\s"'<>#]+/);
    if (!m) return '';
    var u = m[0];
    if (!/[?&]view=dash/.test(u) || !/[?&]key=/.test(u)) return '';
    return u.replace(/[?&]m=\d{4}-\d{2}/, '');
  }

  function open(u) {
    current = u;
    if (!navigator.onLine) { show('offline'); return; }
    show('loading');
    $('loadMsg').textContent = 'กำลังโหลดข้อมูล…';
    var slow = setTimeout(function () { $('loadMsg').textContent = 'ใกล้เสร็จแล้ว รอสักครู่นะ…'; }, 6000);
    var f = $('frame');
    f.onload = function () { clearTimeout(slow); show(null); };
    f.src = u + (u.indexOf('?') < 0 ? '?' : '&') + 't=' + Date.now();
  }

  function setup(canCancel) {
    $('url').value = '';
    $('err').textContent = '';
    $('cancel').classList.toggle('hidden', !canCancel);
    show('setup');
  }

  $('save').onclick = function () {
    var u = clean($('url').value);
    if (!u) { $('err').textContent = 'ลิงก์ไม่ถูกต้อง ต้องเป็นลิงก์แดชบอร์ดจากบอทครับ'; return; }
    store.set(u);
    open(u);
  };
  $('cancel').onclick = function () { open(store.get()); };
  $('retry').onclick = function () { open(current || store.get()); };
  $('fab').onclick = function () { $('sheet').classList.remove('hidden'); };
  $('close').onclick = function () { $('sheet').classList.add('hidden'); };
  $('sheet').onclick = function (e) { if (e.target.id === 'sheet') $('sheet').classList.add('hidden'); };
  $('reload').onclick = function () { $('sheet').classList.add('hidden'); open(store.get()); };
  $('change').onclick = function () { $('sheet').classList.add('hidden'); setup(true); };
  window.addEventListener('online', function () { if (!$('offline').classList.contains('hidden')) open(current || store.get()); });

  // ลิงก์แบบแตะครั้งเดียว: index.html#u=<ลิงก์แดชบอร์ด>
  var h = location.hash.match(/[#&]u=([^&]+)/);
  if (h) {
    var hu = clean(decodeURIComponent(h[1]));
    if (hu) store.set(hu);
    history.replaceState(null, '', location.pathname);
  }

  // กลับมาเปิดแอปหลังทิ้งไว้นาน → โหลดข้อมูลใหม่
  var hiddenAt = 0;
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { hiddenAt = Date.now(); return; }
    if (hiddenAt && Date.now() - hiddenAt > 10 * 60 * 1000 && store.get()) open(store.get());
  });

  var saved = store.get();
  if (saved) open(saved); else setup(false);

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>
